name: Profile validation

on:
  pull_request:
    paths:
      - "README.md"
      - "profile/**"
      - "scripts/validate-profile.sh"
      - ".github/workflows/profile-validation.yml"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "profile/**"
      - "scripts/validate-profile.sh"
      - ".github/workflows/profile-validation.yml"

permissions:
  contents: read

jobs:
  validate-profile:
    name: Validate organization profile
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate profile and handbook
        run: bash scripts/validate-profile.sh
